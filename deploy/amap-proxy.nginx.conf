# Include inside an existing HTTPS server block on your map proxy domain.
# No AMap secret goes here: amap-js injects it inside the confirmed Supabase project.
# Add https://art-si.github.io to the Edge secret AMAP_JS_ALLOWED_ORIGINS,
# preserving the existing exact origins. Do not replace the list with '*'.
location ^~ /_AMapService/ {
    proxy_pass https://jupuypvmgjpnpntfetqv.supabase.co/functions/v1/amap-js/_AMapService/;
    proxy_ssl_server_name on;
    proxy_ssl_name jupuypvmgjpnpntfetqv.supabase.co;
    proxy_set_header Host jupuypvmgjpnpntfetqv.supabase.co;
    proxy_set_header Origin $http_origin;
    proxy_set_header Referer $http_referer;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_read_timeout 15s;
    proxy_cache off;
    access_log off;
}
