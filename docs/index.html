    <style>/* Geometry comes from fish-symbol.svg; these rules only size and animate its layers. */
.fish-mark {
  --fish-size: 48px;
  position: relative;
  display: inline-block;
  flex: none;
  width: var(--fish-size);
  height: calc(var(--fish-size) * 0.6);
  color: var(--lake, #0f6b5b);
  vertical-align: middle;
}
.fish-mark__body,
.fish-mark__tail {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.fish-mark__tail {
  transform-origin: 26% 50%;
}
.fish-mark__vector {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.fish-mark--swimming {
  animation: fish-swim 1.8s ease-in-out infinite;
}
.fish-mark--swimming .fish-mark__tail {
  animation: fish-tail 0.6s ease-in-out infinite alternate;
}
@keyframes fish-swim {
  0%,
  100% {
    transform: translateY(1px) rotate(-2deg);
  }
  50% {
    transform: translateY(-2px) rotate(2deg);
  }
}
@keyframes fish-tail {
  from {
    transform: scaleX(0.94) rotate(-3deg);
  }
  to {
    transform: scaleX(1) rotate(3deg);
  }
}
@keyframes fish-bubble {
  0%,
  15% {
    opacity: 0;
    transform: translate(0, 4px) scale(0.65);
  }
  55% {
    opacity: 0.65;
  }
  100% {
    opacity: 0;
    transform: translate(5px, -9px) scale(1);
  }
}
@media (prefers-reduced-motion: reduce) {
  .fish-mark--swimming,
  .fish-mark--swimming .fish-mark__tail,
  .fish-loading__bubble {
    animation: none !important;
  }
}
html {
  color-scheme: light dark;
}
.fishing-boot {
  --lake: #0f6b5b;
  --mist: #f5f7f5;
  --ink: #182d27;
  --reed: #53665f;
  --on-lake: #fff;
  box-sizing: border-box;
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px))
    max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
  background: var(--mist);
  color: var(--reed);
  text-align: center;
  font:
    0.875rem/1.6 'Noto Sans SC',
    'PingFang SC',
    'Microsoft YaHei',
    system-ui,
    sans-serif;
}
.fishing-boot__content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  max-width: 100%;
}
.fishing-boot__water {
  position: relative;
  width: 140px;
  height: 88px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}
.fishing-boot__ripple {
  position: absolute;
  left: 24px;
  bottom: 4px;
  width: 96px;
  height: 12px;
  border-bottom: 1px solid var(--lake);
  border-radius: 50%;
  opacity: 0.25;
}
.fishing-boot__title {
  font-size: 1.375rem;
  line-height: 1.4;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.06em;
}
.fishing-boot__label {
  overflow-wrap: anywhere;
}
.fishing-boot .fish-loading__bubble {
  position: absolute;
  right: 8px;
  top: 10px;
  width: 6px;
  height: 6px;
  border: 1px solid var(--lake);
  border-radius: 50%;
  opacity: 0.5;
  animation: fish-bubble 1.8s ease-out infinite;
}
.fishing-boot .fish-loading__bubble--second {
  width: 3px;
  height: 3px;
  top: -2px;
  right: 0;
  animation-delay: 0.65s;
}
@media (prefers-color-scheme: dark) {
  .fishing-boot {
    --lake: #79ceb8;
    --mist: #111c19;
    --ink: #eaf2ee;
    --reed: #a4b6ae;
    --on-lake: #10221b;
  }
}
@media (prefers-reduced-motion: reduce) {

}
